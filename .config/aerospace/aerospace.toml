config-version = 2

after-startup-command = [
    'exec-and-forget sketchybar',
    'exec-and-forget borders',
    'exec-and-forget ~/scripts/wifi-stat.zsh',
    'exec-and-forget open -a "Hammerspoon.app"',
    'workspace 1',
    'exec-and-forget open -a "Ghostty.app"',
    'exec-and-forget open -a "Obsidian.app"',
    'exec-and-forget sudo ~/bin/kanata/target/release/kanata -c ~/.config/kanata/master-33.kbd',
]

start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

# Mouse follows focus when focused monitor changes
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

on-focus-changed = "move-mouse window-lazy-center"

exec-on-workspace-change = ['/bin/bash', '-c',
    #'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
    'sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

focus-follows-mouse.enabled = true

key-mapping.preset = 'qwerty'

# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

# 'main' binding mode must be always presented
[mode.main.binding]
    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 0'

    alt-f = 'fullscreen'

    alt-tab = 'workspace-back-and-forth'
    cmd-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-comma = 'mode service'
    alt-r = 'mode launch'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    shift-f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    f = ['fullscreen', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    minus = 'resize smart -50'
    shift-equal = 'resize smart +50'
    equal = ['balance-sizes', 'mode main']

    t = 'layout tiles horizontal vertical'
    a = 'layout accordion horizontal vertical'

    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']

    z = ['exec-and-forget ~/scripts/toggle_zen.sh', 'mode main']

[mode.launch.binding]
    alt-r = ['exec-and-forget open -a "Raycast.app"', 'mode main']
    t = ['exec-and-forget open -a "Ghostty.app"', 'mode main']
    o = ['exec-and-forget open -a "Obsidian.app"', 'mode main']
    b = ['exec-and-forget open -a "Brave Browser.app"', 'mode main']
    w = ['exec-and-forget open -a "WhatsApp.app"', 'mode main']
    m = ['exec-and-forget open -a "Mail.app"', 'mode main']
    f = ['exec-and-forget open -a "Finder.app"', 'mode main']
    k = ['exec-and-forget open -a "Sabaki.app"', 'mode main']
    v = ['exec-and-forget code', 'mode main']
    p = ['exec-and-forget open -a "Bitwarden.app"', 'mode main']
    s = ['exec-and-forget open -a "Slack.app"', 'mode main']

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 0']

[[on-window-detected]]
if.app-id = 'net.ankiweb.launcher'
run = ['layout floating']
